[workspace]
resolver = "3"
members = [
    "crates/bea",
    "crates/bntx",
    "crates/cpk",
    "crates/stcm2l",
    "crates/importer",
    "crates/sarc",
    "crates/vm",
    "crates/player",
    "crates/dlplayer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.88"
repository = "https://github.com/Stiven-Gjekaj/DLGEPlayer"
description = "An open-source player for Diabolik Lovers Grand Edition"

[workspace.dependencies]
bea = { path = "crates/bea" }
bntx = { path = "crates/bntx" }
cpk = { path = "crates/cpk" }
stcm2l = { path = "crates/stcm2l" }
importer = { path = "crates/importer" }
sarc = { path = "crates/sarc" }
vm = { path = "crates/vm" }
